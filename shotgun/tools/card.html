<!doctype html>
<!--
  Source of shotgun/site/card.png, the 1280x640 link preview card.
  GitHub shows it when someone shares the repository link (Settings, Social preview).
  The install page uses it as og:image.

  To render it again on macOS, run from the repository root:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1280,640 --user-data-dir="$(mktemp -d)" \
    --screenshot=shotgun/site/card.png "file://$PWD/shotgun/tools/card.html"
  Chrome can keep running after it writes the file. Stop it with Ctrl+C.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #f6f8f5; color: #1f2328; display: flex; align-items: center; gap: 56px; padding: 0 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .left { flex: 1.05; }
  h1 { font-size: 112px; line-height: 1; letter-spacing: -0.04em; font-weight: 800; }
  .tag { font-size: 34px; line-height: 1.25; margin: 18px 0 36px; color: #3b434c; }
  .label { font-size: 21px; font-weight: 600; color: #2f6b4f; margin-bottom: 10px; letter-spacing: 0.01em; }
  .paste {
    font: 24px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #1f2328;
    background: #ffffff; border: 2px solid #dde3dc; border-left: 8px solid #2f6b4f; border-radius: 12px; padding: 18px 22px;
  }
  .right {
    flex: 0.95; background: #ffffff; border: 2px solid #dde3dc; border-radius: 18px; padding: 30px 32px;
    font: 23px/1.75 ui-monospace, SFMono-Regular, Menlo, monospace; color: #3b434c; white-space: pre;
  }
  .right b { color: #1f2328; }
  .foot { position: absolute; bottom: 34px; left: 80px; font-size: 20px; color: #59636e; }
</style>
</head>
<body>
  <div class="left">
    <h1>shotgun</h1>
    <p class="tag">Any coding agent picks up<br>where the last one stopped.</p>
    <p class="label">Paste into Claude Code:</p>
    <p class="paste">Install shotgun from<br>github.com/adamalshoomary/shotgun</p>
  </div>
  <div class="right"><b>your-project/</b>
├── AGENTS.md
├── project-purpose.md
├── current-state.md
└── improvement-plan.md</div>
  <p class="foot">Claude Code · Codex · any agent that reads Agent Skills</p>
</body>
</html>
